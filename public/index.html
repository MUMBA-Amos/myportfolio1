<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SVG first for browsers that take it, .ico as the fallback -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Matches the paper the page is drawn on, so mobile browser chrome
         tints to it rather than to black -->
    <meta name="theme-color" content="#f5f5ef" />

    <title>Mumba Amos Ntambo — Full-Stack &amp; AI Engineer</title>
    <meta
      name="description"
      content="Full-stack and platform engineering, across AI services, cloud infrastructure, web and mobile. Selected work, experience and contact."
    />
    <meta name="author" content="Mumba Amos Ntambo" />

    <!-- Open Graph: what WhatsApp, Telegram, Slack, LinkedIn and Facebook
         read when the link is shared. og:image has to be an absolute URL —
         scrapers do not resolve relative paths — so it carries the domain.
         Update these three if the site moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mumba Amos Ntambo" />
    <meta
      property="og:url"
      content="https://myportfolio1-coral.vercel.app/"
    />
    <meta
      property="og:title"
      content="Mumba Amos Ntambo — Full-Stack &amp; AI Engineer"
    />
    <meta
      property="og:description"
      content="Full-stack and platform engineering, across AI services, cloud infrastructure, web and mobile."
    />
    <meta
      property="og:image"
      content="https://myportfolio1-coral.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mumba Amos Ntambo, full-stack and AI engineer"
    />

    <!-- Twitter/X reads its own namespace rather than falling back to og -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mumba Amos Ntambo — Full-Stack &amp; AI Engineer"
    />
    <meta
      name="twitter:description"
      content="Full-stack and platform engineering, across AI services, cloud infrastructure, web and mobile."
    />
    <meta
      name="twitter:image"
      content="https://myportfolio1-coral.vercel.app/og.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Host+Grotesk:wght@500;600;700;800&family=Caveat:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
