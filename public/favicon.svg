<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mumba">
  <!-- Solid ink tile rather than paper: at 16px in a tab strip a light
       ground disappears into the browser's own chrome. -->
  <rect width="64" height="64" rx="12" fill="#1b1e0c"/>
  <text x="30" y="45"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="-2"
        text-anchor="middle" fill="#f5f5ef">M</text>
  <!-- The wordmark's full stop, which is the mark's whole character -->
  <circle cx="50" cy="42" r="4.5" fill="#f5f5ef"/>
</svg>
